# nginx for the Easy First site. deploy/install.sh fills in __DOMAIN__ and copies it to
# /etc/nginx/sites-available/easyfirst. certbot then adds HTTPS to both blocks.

# www.<domain> → <domain>: the admin panel accepts changes from one address only.
server {
    listen 80;
    server_name www.__DOMAIN__;
    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 80;
    server_name __DOMAIN__;

    # Pictures and videos uploaded from the panel (the server itself allows 40 MB per video).
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # One address, set here: a visitor cannot pass a false one (the server reads the last).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
